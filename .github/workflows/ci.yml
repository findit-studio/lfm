name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: [cron: "0 2 * * 1"]  # Mondays at 02:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Every row runs on both OSes. `build.rs` emits `mlx_backend` only for
  # `aarch64-apple-darwin`, so the ubuntu leg lints none of the mlx backend:
  # `src/runtime/mlx_backend.rs`, the `Mlx` arms, and the mlx-gated items in
  # `src/engine.rs`, `src/options.rs` and `tests/options_document.rs`. The macOS
  # leg lints them, which compiles `mlxrs-sys` as `build` does there; `mlxrs` is
  # a target dependency, so even `--no-default-features` builds it. `macos-15`
  # is an Apple Silicon image, the only kind that has the target.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: clippy (decoders only)
        run: cargo clippy --all-targets --no-default-features --features decoders -- -D warnings
      # `serde` is in no default set, so none of the three runs above lints the
      # derives or the serde-gated unit tests in `src/options.rs`, and
      # `tests/options_document.rs` (`required-features = ["serde"]`) is a target
      # cargo skips when it cannot enable it: that code was never linted. The
      # second row drops the inference backend, so the same code is also linted
      # without it.
      - name: clippy (--features serde)
        run: cargo clippy --all-targets --features serde -- -D warnings
      - name: clippy (--no-default-features --features serde)
        run: cargo clippy --all-targets --no-default-features --features serde -- -D warnings
      # `npz` and `gguf` are in no default set, and both forward to `mlxrs`, a
      # dependency of `aarch64-apple-darwin` alone: they enable nothing on the
      # ubuntu leg, so this row runs on the macOS leg only. None of the rows
      # above lints `Engine::from_mlx_npz` and `from_mlx_gguf` with their
      # `_unchecked` doors, the `mlx_backend` loaders behind them, or the two
      # feature-gated blocks of the preprocessing-skew unit test in
      # `src/engine.rs`.
      - name: clippy (--features npz,gguf)
        if: runner.os == 'macOS'
        run: cargo clippy --all-targets --features npz,gguf -- -D warnings

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: build (default features)
        run: cargo build --verbose
      - name: build (--no-default-features)
        run: cargo build --no-default-features --verbose
      - name: build (--no-default-features --features decoders)
        run: cargo build --no-default-features --features decoders --verbose
      - name: build (--features serde)
        run: cargo build --features serde --verbose

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: test (lib only, default features)
        run: cargo test --lib --verbose
      - name: test (lib only, --no-default-features)
        run: cargo test --lib --no-default-features --verbose
      - name: test (lib only, decoders)
        run: cargo test --lib --no-default-features --features decoders --verbose
      # `serde` is in no default set, so none of the three runs above compiles
      # the derives, the serde-gated unit tests in `src/options.rs`, or
      # `tests/options_document.rs` (`required-features = ["serde"]` makes cargo
      # skip a target it cannot enable). These rows compile and RUN them;
      # `build (--features serde)` builds the library alone, never a test
      # target. The second options-document row drops the inference backend, so
      # the round-trip is also proven without it. `integration` and the `smoke` /
      # `scene_analysis` examples need a model, so nothing here runs them.
      - name: test (lib only, --features serde)
        run: cargo test --lib --features serde --verbose
      - name: test (options document, --features serde)
        run: cargo test --features serde --test options_document --verbose
      - name: test (options document, --no-default-features --features serde)
        run: cargo test --no-default-features --features serde --test options_document --verbose
      # `npz` and `gguf` forward to `mlxrs`, a dependency of `aarch64-apple-darwin`
      # alone, so this row runs on the macOS leg only. No row above enables
      # either format, so none compiles or runs the two feature-gated blocks of
      # the preprocessing-skew unit test in `src/engine.rs` (the strict npz and
      # gguf doors refuse a skewed checkpoint) or the formats-on arm of
      # `disabled_weight_format_is_named` in `src/runtime/checkpoint.rs`. Library
      # tests only: no other target gates on either feature.
      - name: test (lib only, --features npz,gguf)
        if: runner.os == 'macOS'
        run: cargo test --lib --features npz,gguf --verbose

  wasm:
    name: wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: check (no-default-features, wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --verbose
      - name: check (decoders, wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features decoders --verbose

  # `build.rs` emits `mlx_backend` only for `aarch64-apple-darwin`, so the ubuntu
  # leg documents none of the mlx-gated public items (`MlxOptions`,
  # `BackendOptions::Mlx`, `Engine::from_mlx_dir` and `from_mlx_safetensors`
  # with their `_unchecked` doors, `Error::Mlx`): a broken or private intra-doc
  # link in their docs fails no `-D warnings` row there. The macOS leg documents
  # them, which compiles `mlxrs-sys` as `build` and `clippy` do there. `macos-15`
  # is an Apple Silicon image, the only kind that has the target. The `npz` and
  # `gguf` constructors (`Engine::from_mlx_npz` and `from_mlx_gguf` with their
  # `_unchecked` doors) are documented by the second step, which only the macOS
  # leg runs: both features forward to `mlxrs`, a dependency of that target
  # alone, so they enable nothing on ubuntu. It runs beside the first step, not
  # in place of it, so the macOS leg still documents the MLX items with both
  # formats off, where a link from an always-present item to a gated one fails.
  doc:
    name: doc build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --features inference,bundled,decoders,serde
      - name: cargo doc (npz, gguf)
        if: runner.os == 'macOS'
        run: cargo doc --no-deps --features inference,bundled,decoders,serde,npz,gguf
