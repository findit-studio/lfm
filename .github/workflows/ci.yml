name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: [cron: "0 2 * * 1"]  # Mondays at 02:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: clippy (decoders only)
        run: cargo clippy --all-targets --no-default-features --features decoders -- -D warnings
      # `serde` is in no default set, so none of the three runs above lints the
      # derives or the serde-gated unit tests in `src/options.rs`, and
      # `tests/options_document.rs` (`required-features = ["serde"]`) is a target
      # cargo skips when it cannot enable it: that code was never linted. The
      # second row drops the inference backend, so the same code is also linted
      # without it.
      - name: clippy (--features serde)
        run: cargo clippy --all-targets --features serde -- -D warnings
      - name: clippy (--no-default-features --features serde)
        run: cargo clippy --all-targets --no-default-features --features serde -- -D warnings

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: build (default features)
        run: cargo build --verbose
      - name: build (--no-default-features)
        run: cargo build --no-default-features --verbose
      - name: build (--no-default-features --features decoders)
        run: cargo build --no-default-features --features decoders --verbose
      - name: build (--features serde)
        run: cargo build --features serde --verbose

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: test (lib only, default features)
        run: cargo test --lib --verbose
      - name: test (lib only, --no-default-features)
        run: cargo test --lib --no-default-features --verbose
      - name: test (lib only, decoders)
        run: cargo test --lib --no-default-features --features decoders --verbose
      # `serde` is in no default set, so none of the three runs above compiles
      # the derives, the serde-gated unit tests in `src/options.rs`, or
      # `tests/options_document.rs` (`required-features = ["serde"]` makes cargo
      # skip a target it cannot enable). These rows compile and RUN them;
      # `build (--features serde)` builds the library alone, never a test
      # target. The second options-document row drops the inference backend, so
      # the round-trip is also proven without it. `integration` and the `smoke` /
      # `scene_analysis` examples need a model, so nothing here runs them.
      - name: test (lib only, --features serde)
        run: cargo test --lib --features serde --verbose
      - name: test (options document, --features serde)
        run: cargo test --features serde --test options_document --verbose
      - name: test (options document, --no-default-features --features serde)
        run: cargo test --no-default-features --features serde --test options_document --verbose

  wasm:
    name: wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: check (no-default-features, wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --verbose
      - name: check (decoders, wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features decoders --verbose

  doc:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --features inference,bundled,decoders,serde
